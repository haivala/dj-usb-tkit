name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag_input="${{ inputs.tag || '' }}"
          if [[ -n "$tag_input" ]]; then
            tag="$tag_input"
            checkout_ref="$tag_input"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          else
            echo "Release workflow requires a tag. Push a v* tag or provide the tag input when dispatching manually." >&2
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            echo "Release tags must start with v, for example v0.1.0." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "draft=${{ inputs.draft || false }}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ inputs.prerelease || false }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact_suffix: linux
            bundles: deb,rpm,appimage
          - name: macOS
            os: macos-latest
            artifact_suffix: macos
            bundles: dmg
          - name: Windows
            os: windows-2022
            artifact_suffix: windows
            bundles: nsis,msi
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Node.js
        if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            vanilla-ui/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2

      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # rusqlite's bundled-sqlcipher-vendored-openssl feature enables
          # openssl-sys's "vendored" Cargo feature, which by default compiles
          # OpenSSL from source via Perl's Configure script. GitHub's Windows
          # runner image and Chocolatey's openssl package only ship the
          # "Light" (DLL-only, no static libs) OpenSSL variant, so neither is
          # usable here. Instead, install the full slproweb Win64 OpenSSL
          # package (same one scripts/windows-build-setup.ps1 uses for local
          # dev). Its lib\VC\x64\MD libs are import libraries for the
          # libcrypto/libssl DLLs (dynamic CRT) — linking those still needs
          # the DLL shipped alongside the app. lib\VC\x64\MT holds the
          # genuine, self-contained static libraries (static CRT), so use
          # those: no libcrypto/libssl DLL needed at runtime.
          $opensslRoot = "${env:ProgramFiles}\OpenSSL-Win64"
          if (-not (Test-Path "$opensslRoot\lib\VC\x64\MT\libcrypto.lib")) {
            # Resolve the current Win64 OpenSSL full (non-Light) installer from
            # slproweb's own hash manifest instead of hardcoding a version —
            # slproweb periodically retires old installer URLs (e.g. 3_6_1 404s
            # once 4_0_1 ships), so pinning a version here just goes stale.
            Write-Host "Resolving latest Win64 OpenSSL release..."
            $hashesUrl = "https://raw.githubusercontent.com/slproweb/opensslhashes/master/win32_openssl_hashes.json"
            $hashes = Invoke-RestMethod -Uri $hashesUrl
            $latest = $hashes.files.PSObject.Properties.Value |
              Where-Object { $_.bits -eq 64 -and $_.arch -eq 'INTEL' -and -not $_.light -and $_.installer -eq 'exe' } |
              Sort-Object -Property @{ Expression = { [version]$_.basever } } -Descending |
              Select-Object -First 1
            if (-not $latest) {
              throw "Could not resolve the latest Win64 OpenSSL installer from $hashesUrl"
            }
            Write-Host "Latest: OpenSSL $($latest.basever)$($latest.subver) ($($latest.url))"

            Write-Host "Installing full OpenSSL (slproweb) to $opensslRoot..."
            $opensslExe = "$env:TEMP\Win64OpenSSL.exe"
            Invoke-WebRequest -Uri $latest.url -OutFile $opensslExe
            $actualHash = (Get-FileHash -Path $opensslExe -Algorithm SHA256).Hash
            if ($actualHash -ne $latest.sha256.ToUpper()) {
              throw "Downloaded OpenSSL installer hash mismatch: expected $($latest.sha256), got $actualHash"
            }
            Start-Process $opensslExe -ArgumentList '/SILENT', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$opensslRoot`"" -Wait
          }

          if (-not (Test-Path "$opensslRoot\lib\VC\x64\MT\libcrypto.lib")) {
            throw "OpenSSL static libraries were not found under $opensslRoot\lib\VC\x64\MT after installation."
          }

          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$opensslRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_INCLUDE_DIR=$opensslRoot\include"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_LIB_DIR=$opensslRoot\lib\VC\x64\MT"
          # Makes openssl-sys use the static libs above via a normal find,
          # instead of compiling from source, even though the "vendored"
          # Cargo feature is enabled.
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_NO_VENDOR=1"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_STATIC=1"

      - name: Cache Linux Docker-build Rust/npm artifacts
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            target
            .docker-cache/cargo-registry
            .docker-cache/cargo-git
            .docker-cache/npm
          key: linux-docker-build-${{ hashFiles('Cargo.lock', 'vanilla-ui/package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            linux-docker-build-

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      - name: Build Linux Docker build image (cached)
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        env:
          # Without this, buildx uploads a `*.dockerbuild` build-record
          # artifact that the publish job's unfiltered download-artifact step
          # then tries to fetch alongside the real platform bundles.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: scripts/Dockerfile.linux-build
          tags: djtkit-linux-build:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Linux release bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUN_TESTS: "0"
        run: |
          set -euo pipefail
          ./scripts/linux-release-docker.sh

      - name: Build native release bundles
        if: runner.os != 'Linux'
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUN_TESTS: "0"
        run: |
          set -euo pipefail
          ./scripts/release.sh

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: djtkit-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          # Excludes buildx's `*.dockerbuild` build-record artifact (see the
          # env vars on the "Build Linux Docker build image" step, which
          # should already stop it from being uploaded at all — this is a
          # backstop per Docker's own guidance) and any other stray
          # artifacts, leaving only the djtkit-* platform bundles.
          pattern: djtkit-*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag does not exist on origin: $TAG" >&2
            exit 1
          fi

          mapfile -d '' files < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.dmg' -o \
              -name '*.msi' -o \
              -name '*.exe' \
            \) -print0 | sort -z
          )

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          version="${TAG#v}"
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]|$)" { found=1; next }
            found && $0 ~ "^##[[:space:]]+" { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            printf 'Automated release for %s.\n' "$TAG" > "$notes_file"
          fi

          title="DJ USB Tkit $version"
          release_flags=()
          if [[ "$DRAFT" == "true" ]]; then
            release_flags+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi
