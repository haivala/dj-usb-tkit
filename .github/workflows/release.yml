name: Release

on:
  push:
    # Tag caches cannot be restored by later tags. Build on the default
    # branch too, so release jobs have a shared cache they can restore.
    # Only for changes to what the caches hold (dependencies, the build
    # image, build settings), not for every code push. A version bump
    # changes Cargo.lock, so each release gets one such build before its tag.
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "vanilla-ui/package-lock.json"
      - "desktop/package-lock.json"
      - ".cargo/**"
      - "scripts/Dockerfile.linux-build"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.0"
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          # Populate default-branch caches without publishing a release.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "checkout_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_input="${{ inputs.tag || '' }}"
          if [[ -n "$tag_input" ]]; then
            tag="$tag_input"
            checkout_ref="$tag_input"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
          else
            echo "Release workflow requires a tag. Push a v* tag or provide the tag input when dispatching manually." >&2
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            echo "Release tags must start with v, for example v0.1.0." >&2
            exit 1
          fi

          # A semver prerelease tag (v0.3.7-rc.1) is always a GitHub
          # prerelease. GitHub never makes a prerelease "latest", so the
          # in-app updater (releases/latest/download/latest.json) and the
          # update check keep stable installs off it.
          prerelease="${{ inputs.prerelease || false }}"
          if [[ "${tag%%+*}" == *-* ]]; then
            prerelease=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "draft=${{ inputs.draft || false }}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact_suffix: linux
            bundles: deb,rpm,appimage
          - name: macOS
            os: macos-latest
            artifact_suffix: macos
            # `app` produces the .app.tar.gz the in-app updater installs.
            bundles: app,dmg
          - name: Windows
            os: windows-2022
            artifact_suffix: windows
            bundles: nsis
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Node.js
        if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            vanilla-ui/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Installs the version pinned in rust-toolchain.toml.
          rustup toolchain install

      # Tag builds only restore: a cache saved from a tag can be restored by
      # that tag alone, and would take room from the default-branch caches in
      # the repository's cache quota.
      - name: Cache Rust build artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Configure Windows OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # rusqlite's bundled-sqlcipher-vendored-openssl feature enables
          # openssl-sys's "vendored" Cargo feature: it compiles OpenSSL from
          # source (via openssl-src, which shells out to Perl for OpenSSL's
          # own Configure script) and links the result in as a genuine,
          # self-contained static library — no libcrypto/libssl DLL is ever
          # produced, so none is needed at runtime.
          #
          # This used to instead point OPENSSL_LIB_DIR at a prebuilt OpenSSL
          # package's supposedly-static libs, to avoid the Perl/Configure
          # step. Those libs turned out to still be DLL import libraries
          # regardless of which folder they came from, so the shipped app
          # kept needing libcrypto-<major>-x64.dll at runtime. Do not set
          # OPENSSL_DIR / OPENSSL_LIB_DIR / OPENSSL_NO_VENDOR here — any of
          # those disables (or bypasses) the from-source, genuinely-static
          # build.
          #
          # "Build native release bundles" runs under `shell: bash` (Git
          # Bash on this runner), where Git's own bundled minimal Perl can
          # shadow the full one on PATH and fail with missing modules (e.g.
          # Locale::Maketext::Simple) that OpenSSL's Configure needs. Point
          # PERL explicitly at the runner image's Strawberry Perl so that
          # can't happen.
          $strawberryPerl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $strawberryPerl)) {
            throw "Expected Strawberry Perl at $strawberryPerl (should be preinstalled on this runner image)."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PERL=$strawberryPerl"

          # NASM speeds up the build (assembly-optimized OpenSSL routines);
          # openssl-src automatically falls back to a plain-C build without
          # it, so this is a nice-to-have, not required for correctness.
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress | Out-Null
          }
          $nasmDir = Get-ChildItem "${env:ProgramFiles}\NASM" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nasmDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $nasmDir.FullName
          }

      - name: Restore Linux Docker-build Rust/npm artifacts
        id: linux_cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            target
            .docker-cache/cargo-registry
            .docker-cache/cargo-git
            .docker-cache/npm
          key: linux-docker-build-${{ hashFiles('Cargo.lock', 'vanilla-ui/package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            linux-docker-build-

      - name: Set up Docker Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v3

      # The image's apt layer is keyed on the build date (see APT_REFRESH in
      # the Dockerfile), so a release bundles the current 22.04 WebKitGTK
      # instead of whatever the cached layer first installed.
      - name: Date for the Docker apt layer
        if: runner.os == 'Linux'
        shell: bash
        run: echo "APT_REFRESH=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build Linux Docker build image (cached)
        if: runner.os == 'Linux'
        uses: docker/build-push-action@v6
        env:
          # Without this, buildx uploads a `*.dockerbuild` build-record
          # artifact that the publish job's unfiltered download-artifact step
          # then tries to fetch alongside the real platform bundles.
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: scripts/Dockerfile.linux-build
          tags: djtkit-linux-build:latest
          load: true
          build-args: |
            APT_REFRESH=${{ env.APT_REFRESH }}
          cache-from: type=gha
          cache-to: ${{ github.ref_type != 'tag' && 'type=gha,mode=max' || '' }}

      - name: Build Linux release bundles
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUN_TESTS: "0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./scripts/linux-release-docker.sh

      - name: Build native release bundles
        if: runner.os != 'Linux'
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          RUN_TESTS: "0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./scripts/release.sh

      - name: Verify Windows build has no libcrypto/libssl DLL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exePath = "target\release\dj_usb_tkit_desktop.exe"
          if (-not (Test-Path $exePath)) {
            throw "$exePath not found — expected the native build step to have produced it."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsInstall\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          if (-not $dumpbin) {
            throw "Could not locate dumpbin.exe under $vsInstall"
          }

          $deps = & $dumpbin.FullName /dependents $exePath | Out-String
          Write-Host $deps
          if ($deps -match "libcrypto|libssl") {
            throw "dj_usb_tkit_desktop.exe depends on a libcrypto/libssl DLL — OpenSSL is not being linked statically. See dependents output above."
          }
          Write-Host "OK: no libcrypto/libssl DLL dependency." -ForegroundColor Green

      - name: Upload bundle artifacts
        if: needs.prepare.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: djtkit-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.sig

      # Saved after the upload so the finished bundles can be left out of it.
      - name: Drop bundles from the cached target directory
        if: runner.os == 'Linux' && github.ref_type != 'tag' && steps.linux_cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/release/bundle

      - name: Save Linux Docker-build Rust/npm artifacts
        if: runner.os == 'Linux' && github.ref_type != 'tag' && steps.linux_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target
            .docker-cache/cargo-registry
            .docker-cache/cargo-git
            .docker-cache/npm
          key: ${{ steps.linux_cache.outputs.cache-primary-key }}

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.tag != ''
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          # Excludes buildx's `*.dockerbuild` build-record artifact (see the
          # env vars on the "Build Linux Docker build image" step, which
          # should already stop it from being uploaded at all — this is a
          # backstop per Docker's own guidance) and any other stray
          # artifacts, leaving only the djtkit-* platform bundles.
          pattern: djtkit-*

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag does not exist on origin: $TAG" >&2
            exit 1
          fi

          version="${TAG#v}"
          notes_file="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]|$)" { found=1; next }
            found && $0 ~ "^##[[:space:]]+" { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            printf 'Automated release for %s.\n' "$TAG" > "$notes_file"
          fi

          # Renames assets with spaces in their names and writes
          # release-assets/latest.json for the in-app updater (skipped when the
          # build had no signing key).
          node scripts/make_updater_manifest.mjs release-assets "$TAG" "$notes_file"

          # The .sig files are only inputs to latest.json; they aren't published.
          mapfile -d '' files < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.app.tar.gz' -o \
              -name 'latest.json' \
            \) -print0 | sort -z
          )

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          title="DJ USB Tkit $version"
          release_flags=()
          if [[ "$DRAFT" == "true" ]]; then
            release_flags+=(--draft)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${release_flags[@]}"
          fi

  # Updates the AUR package dj-usb-tkit-bin to the release's .deb. Stable,
  # public releases only: a draft's assets can't be downloaded, and a
  # prerelease must not reach Arch users. Needs the AUR_SSH_PRIVATE_KEY secret
  # (the private key registered on the AUR account); skipped without it.
  aur:
    name: Update AUR package
    if: >-
      needs.prepare.outputs.tag != '' &&
      needs.prepare.outputs.prerelease != 'true' &&
      needs.prepare.outputs.draft != 'true'
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Build and push the AUR package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set; skipping the AUR update."
            exit 0
          fi

          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"

          ssh_dir=/home/builder/.ssh
          install -d -m 700 -o builder -g builder "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/aur"
          # The AUR's published ed25519 host key, pinned instead of trusting
          # whatever answers on first connect.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chown builder: "$ssh_dir"/*
          chmod 600 "$ssh_dir"/*

          sudo -u builder -H \
            GIT_AUTHOR_NAME="${GITHUB_ACTOR}" \
            GIT_AUTHOR_EMAIL="${GITHUB_ACTOR}@users.noreply.github.com" \
            GIT_COMMITTER_NAME="${GITHUB_ACTOR}" \
            GIT_COMMITTER_EMAIL="${GITHUB_ACTOR}@users.noreply.github.com" \
            ./scripts/aur-release.sh "$TAG" --push
