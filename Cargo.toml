[workspace]
members = ["backend", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.6"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = "thin"
# The default 16 units let the app's own crates compile on all cores; they
# rebuild on every release (the version bump), and at 1 unit they ran on one
# core. Thin LTO still optimizes across the units.
codegen-units = 16
strip = true
panic = "abort"

# The audio-analysis DSP is FFT-bound; `opt-level = "z"` (no autovectorization,
# size-first codegen) makes `analyze_new_tracks` several times slower for a
# negligible bundle-size saving. Give the analysis engine and its FFT backend a
# real speed build without changing the size-first default for the rest of the
# tree.
[profile.release.package.stratum-dsp]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
# MP3 transcoding (LAME, built from C by mp3lame-sys) gets the same speed
# build, and so do the FLAC/ALAC decoders the transcoder reads with.
[profile.release.package.mp3lame-sys]
opt-level = 3
[profile.release.package.symphonia-bundle-flac]
opt-level = 3
[profile.release.package.symphonia-codec-alac]
opt-level = 3
# Analysis decodes every track it reads (rodio first, symphonia as the
# fallback), and the waveform and BPM refinement run in the backend crate
# itself, over every sample of the track: all of them get the speed build too.
# Rust has no fast-math, so the analysis results don't change with it.
[profile.release.package.backend]
opt-level = 3
[profile.release.package.rodio]
opt-level = 3
[profile.release.package.symphonia-core]
opt-level = 3
[profile.release.package.symphonia-bundle-mp3]
opt-level = 3
[profile.release.package.symphonia-codec-aac]
opt-level = 3
[profile.release.package.symphonia-codec-pcm]
opt-level = 3
[profile.release.package.symphonia-codec-vorbis]
opt-level = 3
[profile.release.package.symphonia-format-isomp4]
opt-level = 3
[profile.release.package.symphonia-format-ogg]
opt-level = 3
[profile.release.package.symphonia-format-riff]
opt-level = 3
[profile.release.package.opusic-sys]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Playback decodes inside the audio callback (rodio pulls samples from cpal's
# thread), so the decode path gets a speed build in dev too, leaving more
# headroom before an underrun. The app's own crates stay at debug settings.
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-codec-alac]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.opusic-sys]
opt-level = 3
[profile.dev.package.rodio]
opt-level = 3
