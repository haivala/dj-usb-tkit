[workspace]
members = ["backend", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.29"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
