[workspace]
members = ["backend", "desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.36"
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The audio-analysis DSP is FFT-bound; `opt-level = "z"` (no autovectorization,
# size-first codegen) makes `analyze_new_tracks` several times slower for a
# negligible bundle-size saving. Give the analysis engine and its FFT backend a
# real speed build without changing the size-first default for the rest of the
# tree.
[profile.release.package.stratum-dsp]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
