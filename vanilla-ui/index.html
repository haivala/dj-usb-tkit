<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ USB Tkit</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>html{background:#f0edf5}@media(prefers-color-scheme:dark){html:not([data-theme]){background:#0c0a12}}html[data-theme="dark"]{background:#0c0a12}html[data-theme="light"]{background:#f0edf5}</style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand-mark">
      <!-- Themed brand logo: USB stick colors follow --accent / --accent-hot CSS variables -->
      <svg class="brand-logo" width="200" height="44" viewBox="0 0 200 44" role="img" aria-label="DJ USB Tkit" translate="no">
        <defs>
          <linearGradient id="usb-body-t" x1="0" y1="0" x2="0" y2="1">
            <stop class="usb-grad-top"/>
            <stop class="usb-grad-bot" offset="1"/>
          </linearGradient>
        </defs>
        <text x="2" y="30" font-family="'Outfit', system-ui, sans-serif" font-size="26" font-weight="700" fill="currentColor">DJ</text>
        <!-- USB icon -->
        <g transform="translate(40,2)">
          <!-- connector cap -->
          <rect x="3" y="0" width="13" height="15" rx="1" fill="#b0abb8"/>
          <!-- connector pins -->
          <rect x="5" y="5" width="3.5" height="2.5" rx="0.5" class="usb-pin"/>
          <rect x="11" y="5" width="3.5" height="2.5" rx="0.5" class="usb-pin"/>
          <!-- body -->
          <rect x="0" y="12" width="19" height="30" rx="2.5" fill="url(#usb-body-t)"/>
          <!-- waveform bars -->
          <rect x="3.5"  y="22" width="1.2" height="5"  rx="0.6" class="usb-wave" opacity="0.55"/>
          <rect x="5.5"  y="20" width="1.2" height="9"  rx="0.6" class="usb-wave" opacity="0.65"/>
          <rect x="7.5"  y="18" width="1.2" height="13" rx="0.6" class="usb-wave" opacity="0.75"/>
          <rect x="9.5"  y="17" width="1.2" height="15" rx="0.6" class="usb-wave" opacity="0.85"/>
          <rect x="11.5" y="19" width="1.2" height="11" rx="0.6" class="usb-wave" opacity="0.7"/>
          <rect x="13.5" y="21" width="1.2" height="7"  rx="0.6" class="usb-wave" opacity="0.6"/>
          <rect x="15.5" y="23" width="1.2" height="3"  rx="0.6" class="usb-wave" opacity="0.5"/>
        </g>
        <text x="64" y="30" font-family="'Outfit', system-ui, sans-serif" font-size="26" font-weight="700" fill="currentColor">Tkit</text>
      </svg>
    </h1>
    <div class="status-wrap">
      <div class="status" id="statusText" data-text="ui-common-idle"></div>
      <div class="header-export-stack">
        <div class="playlist-badge inactive" id="playlistBadge">
          <span class="playlist-header-dot"></span>
          <span class="header-stat-label" data-text="ui-header-playlist-badge"></span>
          <span class="header-stat-value" id="badgeLabel" data-text="ui-header-badge-none"></span>
        </div>
        <div class="usb-name-badge" id="usbNameBadge" role="button" tabindex="-1" aria-disabled="true">
          <span class="usb-health-dot" id="usbHeaderHealthDot" data-text-tooltip="ui-usb-health-unknown" data-text-aria-label="ui-usb-health-unknown"></span>
          <span class="header-stat-label" data-text="ui-common-usb"></span>
          <span class="header-stat-value" id="usbNameBadgeLabel" data-text="ui-header-usb-name-badge-not-connected"></span>
        </div>
      </div>
      <div class="header-utility-group">
        <button class="help-btn" id="helpBtn" data-text-tooltip="ui-header-help" data-text-aria-label="ui-header-help">?</button>
        <button class="settings-btn" id="settingsBtn" data-text-tooltip="ui-common-settings" data-text-aria-label="ui-common-settings">&#9881;<span class="settings-btn-dot hidden" id="settingsUpdateDot"></span></button>
        <button class="help-btn event-log-btn" id="eventLogBtn" data-text-tooltip="ui-common-event-log" data-text-aria-label="ui-common-event-log">&#9776;<span class="event-log-badge hidden" id="eventLogBadge"></span><span class="settings-btn-dot hidden" id="eventLogDot"></span></button>
      </div>
    </div>
  </header>

  <div class="update-banner hidden" id="updateBanner" role="alert">
    <span id="updateBannerText"><span class="update-banner-message"></span> — <a href="#" class="update-banner-link" data-text="ui-header-update-banner-view-release"></a></span>
    <span class="update-actions" id="updateBannerActions">
      <button class="update-install-btn hidden" type="button" data-text="ui-common-update-restart"></button>
      <a href="#" class="update-download-link hidden" data-text="ui-common-update-download"></a>
    </span>
    <button class="update-banner-dismiss" id="updateBannerDismissBtn" data-text-aria-label="ui-common-dismiss">&times;</button>
  </div>

  <div class="app-layout">
    <aside class="nav-sidebar" id="navSidebar">
      <div class="nav-sidebar-header">
        <div class="nav-section-label" data-text="ui-sidebar-manage"></div>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" data-text-tooltip="ui-sidebar-collapse" data-text-aria-label="ui-sidebar-collapse">&#9666;</button>
      </div>
      <nav class="nav-items" role="navigation" data-text-aria-label="ui-sidebar-nav-aria-label">
        <button class="nav-item active" data-view="library" aria-current="true">
          <span class="nav-icon">&#9835;</span>
          <span class="nav-label" data-text="ui-sidebar-library"></span>
        </button>
        <button class="nav-item" data-view="usb">
          <span class="nav-icon">&#9921;</span>
          <span class="nav-label" data-text="ui-common-usb"></span>
        </button>
        <button class="nav-item nav-sub-item" data-view="usb-playlists">
          <span class="nav-label" data-text="ui-sidebar-playlists"></span>
        </button>
        <button class="nav-item nav-sub-item" data-view="usb-history">
          <span class="nav-label" data-text="ui-sidebar-history"></span>
        </button>
        <button class="nav-item nav-sub-item" data-view="usb-player-menu">
          <span class="nav-label" data-text="ui-sidebar-player-menu"></span>
        </button>
        <div class="nav-divider"></div>
        <div class="nav-section-label" data-text="ui-sidebar-playlists"></div>
        <ul class="nav-playlist-list" id="navPlaylistList">
          <li class="nav-playlist-add-item">
            <button class="nav-item nav-add-playlist" id="addPlaylistBtn" data-text-tooltip="ui-sidebar-new-playlist" data-text-aria-label="ui-sidebar-new-playlist">
              <span class="nav-icon">+</span>
              <span class="nav-label" data-text="ui-sidebar-add-playlist"></span>
            </button>
          </li>
          <li class="hidden" id="importPlaylistItem">
            <button class="nav-item nav-add-playlist" id="importPlaylistBtn" data-text-tooltip="ui-sidebar-import-playlist-tooltip" data-text-aria-label="ui-sidebar-import-playlist-aria-label">
              <span class="nav-icon">&#8615;</span>
              <span class="nav-label" data-text="ui-common-import"></span>
            </button>
          </li>
          <!-- dynamic playlist items inserted here by JS -->
        </ul>
      </nav>
      <div class="nav-sidebar-footer">
        <button class="nav-sidebar-footer-link" id="websiteBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="nav-label" data-text="ui-sidebar-website"></span>
        </button>
        <button class="nav-sidebar-footer-link" id="donateBtn" data-text-tooltip="ui-sidebar-donate-tooltip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="nav-label" data-text="ui-sidebar-donate"></span>
        </button>
      </div>
      <div class="nav-sidebar-resizer" id="navSidebarResizer" data-text-tooltip="ui-sidebar-resizer-tooltip" aria-hidden="true"></div>
    </aside>

    <main>
      <section class="panel active" id="panel-library" role="tabpanel">
        <div id="libraryEmptyState"></div>
        <div id="libraryContent">
          <div class="panel-header">
            <h2 data-text="ui-common-media-library"></h2>
            <div class="panel-header-actions">
              <button id="addSourceBtn" data-text="ui-library-add-source"></button>
              <button id="analyzeLibraryBtn" data-primary data-text="ui-library-analyze-library"></button>
            </div>
            <span class="muted panel-header-meta" id="libraryCountsText"></span>
          </div>
          <div class="source-bar collapsed" id="sourceBar">
            <div class="source-filter-header" id="sourceFilterHeader">
              <span class="source-filter-label" data-text="ui-library-sources"></span>
              <span class="source-filter-indicator" id="sourceFilterIndicator" data-text="ui-library-source-filter-indicator"></span>
            </div>
            <div class="source-body" id="sourceBody">
              <div class="source-body-inner">
                <div class="source-row">
                  <span class="source-row-label" data-text="ui-library-folders"></span>
                  <div class="source-chips source-chips-grid" id="sourceChipsContainer"></div>
                </div>
                <div class="source-row hidden" id="libraryChipsRow">
                  <span class="source-row-label" data-text="ui-library-libraries"></span>
                  <div class="source-chips" id="libraryChipsContainer"></div>
                </div>
                <label class="external-rekordbox-db-toggle hidden" id="externalRekordboxDbToggle">
                  <input type="checkbox" id="externalRekordboxDbCheckbox" />
                  <span class="external-rekordbox-db-toggle-label" data-text="ui-library-external-rekordbox-db"></span>
                  <span class="external-rekordbox-db-toggle-path muted" id="externalRekordboxDbPath"></span>
                </label>
              </div>
            </div>
          </div>
          <div class="track-toolbar">
            <div class="search-row">
              <input id="librarySearch" data-text-placeholder="ui-library-search-placeholder" />
            </div>
            <div class="selection-actions is-empty" data-selection-bar="library">
              <span class="selection-count" data-text="ui-selection-bar-count-none"></span>
              <span class="selection-time"></span>
              <span class="selection-hint" data-text="ui-selection-bar-hint-library"></span>
              <button type="button" data-selection-action="add" data-primary disabled hidden>+ <span class="selection-label-long" data-text="ui-selection-bar-add-to-target"></span> <span class="selection-target"></span></button>
              <button type="button" data-selection-action="add-to" disabled data-text-tooltip="ui-selection-bar-add-to-tooltip" data-text="ui-selection-bar-add-to"></button>
              <button type="button" data-selection-action="reanalyze" disabled data-text-tooltip="ui-selection-bar-reanalyze-tooltip" data-text="ui-common-reanalyze"></button>
              <button type="button" data-selection-action="convert" disabled data-text-tooltip="ui-selection-bar-convert-tooltip" data-text="ui-selection-bar-convert"></button>
              <button type="button" data-selection-action="edit" disabled data-text-tooltip="ui-selection-bar-edit-tooltip"><span class="selection-label-long" data-text="ui-selection-bar-edit-details"></span><span class="selection-label-short" data-text="ui-selection-bar-edit-short"></span></button>
              <button type="button" class="selection-clear" data-selection-action="clear" disabled data-text-aria-label="ui-selection-bar-clear-selection" data-text-tooltip="ui-selection-bar-clear-selection">&times;</button>
            </div>
          </div>
          <div class="table-wrap" id="libraryTableWrap">
            <div class="track-grid" data-track-grid data-body-id="libraryTableBody" data-select-all-view="library" data-select-all-id="selectAllTracks" role="table" data-text-aria-label="ui-track-table-library-tracks-aria-label">
              <div class="track-grid-body" id="libraryTableBody" role="rowgroup"></div>
              <div class="track-grid-loading" role="status"><span class="spinner" aria-hidden="true"></span><span data-text="ui-track-table-loading-tracks"></span></div>
            </div>
          </div>
          <p class="muted track-total-time" id="libraryTotalDuration" data-text="ui-track-table-total-time"></p>
        </div>
      </section>

      <section class="panel" id="panel-usb" role="tabpanel" aria-hidden="true">
        <!-- USB Connection Bar — hidden until USB is selected -->
        <div class="usb-connection-bar hidden" id="usbConnectionBar">
          <div class="panel-header">
            <h2 data-text="ui-usb-title"></h2>
            <div class="panel-header-actions">
              <button id="selectUsbFolderBtn" data-primary data-text="ui-usb-select-usb-folder"></button>
              <span class="usb-path-badge" id="usbRootPathText" data-text="ui-usb-root-path"></span>
              <span class="usb-health-dot" id="usbHealthDot" data-text-tooltip="ui-usb-health-unknown" data-text-aria-label="ui-usb-health-unknown"></span>
            </div>
            <div class="panel-header-actions hidden" id="usbDiagToolbar">
              <button id="reDiagnoseBtn" data-text="ui-usb-re-diagnose"></button>
              <button id="runUsbParityBtn" data-text-tooltip="ui-usb-parity-report-tooltip" data-text="ui-usb-parity-report"></button>
              <span class="usb-cfg-toolbar-sep"></span>
              <button id="previewRepairsBtn" data-text="ui-usb-preview-repairs"></button>
              <span class="usb-cfg-toolbar-sep"></span>
              <button id="usbBackupsBtn" data-text-tooltip="ui-usb-backups-tooltip" data-text="ui-common-backups"></button>
            </div>
          </div>
          <div class="source-bar usb-cfg-recent-bar" id="usbRecentRow">
            <div class="source-filter-header" id="usbRecentHeader">
              <span class="source-filter-label" data-text="ui-usb-recent"></span>
            </div>
            <div class="source-body">
              <div class="source-body-inner">
                <div class="usb-cfg-recent-list" id="usbRecentList"></div>
              </div>
            </div>
          </div>
          <div class="usb-cfg-init-row hidden" id="usbInitRow">
            <span class="muted" id="usbInitHint" data-text="ui-usb-init-hint"></span>
            <button id="initializeUsbBtn" data-text="ui-usb-initialize-usb"></button>
          </div>
        </div>

        <div id="usbEmptyState"></div>

        <!-- Health & Diagnostics -->
        <div id="usbSelectedControls" class="hidden">
          <div class="source-bar usb-cfg-audio-formats-bar" id="usbAudioFormatsRow">
            <div class="source-filter-header" id="usbAudioFormatsHeader">
              <span class="source-filter-label" data-text="ui-usb-audio-formats"></span>
              <span class="muted usb-cfg-audio-formats-hint" id="usbAudioFormatsHint"></span>
            </div>
            <div class="source-body">
              <div class="source-body-inner">
                <div class="usb-cfg-audio-formats-list" id="usbAudioFormatsList"></div>
              </div>
            </div>
          </div>
          <details class="usb-health-card" id="usbHealthCard">
            <summary class="usb-health-summary">
              <span class="usb-cfg-section-label" data-text="ui-usb-health-card"></span>
              <span id="diagOverallStatus" class="diag-badge"></span>
              <span id="diagParityStatus" class="diag-badge"></span>
              <span class="muted" id="diagDuration"></span>
            </summary>
            <div class="usb-health-content">
              <div class="diag-card hidden" id="usbDiagnosticsCard">
                <!-- Diagnostics report view (default) -->
                <div id="diagReportView">
                  <div id="diagSections"></div>
                </div>

                <!-- Repair preview view (replaces report when active) -->
                <div id="diagRepairPanel" class="hidden">
                  <p id="diagRepairSummary" class="diag-repair-summary"></p>
                  <div id="diagRepairOverview"></div>
                  <details class="diag-details diag-technical" id="diagRepairTechnical">
                    <summary class="muted" data-text="ui-usb-repair-technical-details"></summary>
                    <ul id="diagRepairFixes" class="diag-repair-list"></ul>
                  </details>
                  <div class="diag-repair-actions">
                    <button id="diagBackToReportBtn" data-text="ui-usb-diag-back-to-report"></button>
                    <button id="applyRepairsBtn" disabled data-primary data-text="ui-usb-apply-repairs"></button>
                  </div>
                </div>
              </div>
            </div>
          </details>

        </div>
      </section>

      <!-- USB Playlists panel -->
      <section class="panel" id="panel-usb-playlists" role="tabpanel" aria-hidden="true">
        <div class="panel-header">
          <h2 data-text="ui-common-usb-playlists"></h2>
          <span class="muted panel-header-meta" id="usbCountsText"></span>
          <!-- Edit order: the playlists' and their tracks' order, saved in one write. -->
          <div class="panel-header-end usb-order-edit hidden" id="usbOrderEditBar">
            <span class="muted panel-header-meta hidden" id="usbOrderEditText"></span>
            <button type="button" id="usbEditOrderBtn" data-text="ui-usb-playlists-edit-order"></button>
            <button type="button" id="usbCancelOrderBtn" class="hidden" data-text="ui-common-cancel"></button>
            <button type="button" id="usbSaveOrderBtn" class="hidden" data-primary disabled data-text="ui-usb-playlists-save-order"></button>
          </div>
        </div>
        <div class="split">
          <ul id="usbPlaylists" class="list list-compact left" data-empty-text="No playlists on this USB."></ul>
          <div class="right">
            <div class="track-list-heading hidden" id="usbPlaylistHeading">
              <h3 class="track-list-heading-name"></h3>
              <span class="muted track-list-heading-count"></span>
            </div>
            <div class="track-toolbar">
              <div class="search-row">
                <input id="usbTrackSearch" data-text-placeholder="ui-usb-playlists-search-placeholder" />
              </div>
              <div class="selection-actions is-empty" data-selection-bar="usbPlaylist">
                <span class="selection-count" data-text="ui-selection-bar-count-none"></span>
                <span class="selection-time"></span>
                <span class="selection-hint" data-text="ui-selection-bar-hint-usb"></span>
                <button type="button" data-selection-action="add" data-primary disabled hidden>+ <span class="selection-label-long" data-text="ui-selection-bar-add-to-target"></span> <span class="selection-target"></span></button>
                <button type="button" data-selection-action="add-to" disabled data-text-tooltip="ui-selection-bar-add-to-tooltip" data-text="ui-selection-bar-add-to"></button>
                <button type="button" data-selection-action="edit" disabled data-text-tooltip="ui-selection-bar-edit-tooltip"><span class="selection-label-long" data-text="ui-selection-bar-edit-details"></span><span class="selection-label-short" data-text="ui-selection-bar-edit-short"></span></button>
                <button type="button" class="selection-clear" data-selection-action="clear" disabled data-text-aria-label="ui-selection-bar-clear-selection" data-text-tooltip="ui-selection-bar-clear-selection">&times;</button>
              </div>
            </div>
            <div class="table-wrap">
              <div class="track-grid" data-track-grid data-body-id="usbPlaylistTracks" data-select-all-view="usbPlaylist" data-drag-column role="table" data-text-aria-label="ui-track-table-usb-playlist-tracks-aria-label">
                <div class="track-grid-body" id="usbPlaylistTracks" role="rowgroup"></div>
                <div class="track-grid-loading" role="status"><span class="spinner" aria-hidden="true"></span><span data-text="ui-track-table-loading-tracks"></span></div>
              </div>
            </div>
            <p class="muted track-total-time" id="usbPlaylistTotalDuration" data-text="ui-track-table-total-time"></p>
          </div>
        </div>
      </section>

      <!-- USB History panel -->
      <section class="panel" id="panel-usb-history" role="tabpanel" aria-hidden="true">
        <div class="panel-header">
          <h2 data-text="ui-usb-history-title"></h2>
          <span class="muted panel-header-meta" id="historyCountsText"></span>
        </div>
        <div class="split">
          <ul id="historyList" class="list list-compact left" data-empty-text="No history on this USB."></ul>
          <div class="right">
            <div class="track-list-heading hidden" id="historyHeading">
              <h3 class="track-list-heading-name"></h3>
              <span class="muted track-list-heading-count"></span>
            </div>
            <div class="track-toolbar">
              <div class="search-row">
                <input id="historyTrackSearch" data-text-placeholder="ui-usb-history-search-placeholder" />
              </div>
              <div class="selection-actions is-empty" data-selection-bar="usbHistory">
                <span class="selection-count" data-text="ui-selection-bar-count-none"></span>
                <span class="selection-time"></span>
                <span class="selection-hint" data-text="ui-selection-bar-hint-usb"></span>
                <button type="button" data-selection-action="add" data-primary disabled hidden>+ <span class="selection-label-long" data-text="ui-selection-bar-add-to-target"></span> <span class="selection-target"></span></button>
                <button type="button" data-selection-action="add-to" disabled data-text-tooltip="ui-selection-bar-add-to-tooltip" data-text="ui-selection-bar-add-to"></button>
                <button type="button" data-selection-action="edit" disabled data-text-tooltip="ui-selection-bar-edit-tooltip"><span class="selection-label-long" data-text="ui-selection-bar-edit-details"></span><span class="selection-label-short" data-text="ui-selection-bar-edit-short"></span></button>
                <button type="button" class="selection-clear" data-selection-action="clear" disabled data-text-aria-label="ui-selection-bar-clear-selection" data-text-tooltip="ui-selection-bar-clear-selection">&times;</button>
              </div>
            </div>
            <div class="table-wrap">
              <div class="track-grid" data-track-grid data-body-id="historyTracks" data-select-all-view="usbHistory" role="table" data-text-aria-label="ui-track-table-usb-history-tracks-aria-label">
                <div class="track-grid-body" id="historyTracks" role="rowgroup"></div>
                <div class="track-grid-loading" role="status"><span class="spinner" aria-hidden="true"></span><span data-text="ui-track-table-loading-tracks"></span></div>
              </div>
            </div>
            <p class="muted track-total-time" id="historyTotalDuration" data-text="ui-track-table-total-time"></p>
            <div class="row panel-actions">
              <button id="exportHistoryTracklistBtn" class="primary-action" data-text="ui-usb-history-export-tracklist"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- USB player menu panel -->
      <section class="panel" id="panel-usb-player-menu" role="tabpanel" aria-hidden="true">
        <h2 data-text="ui-usb-player-menu-title"></h2>
        <div class="bg-color-setting">
          <p class="muted player-menu-label" data-text="ui-usb-player-menu-background-colour"></p>
          <div id="usbBackgroundColorChips" class="bg-color-chips" role="radiogroup" data-text-aria-label="ui-usb-player-menu-background-colour-aria-label"></div>
          <p id="usbBackgroundColorNote" class="muted bg-color-note hidden"></p>
        </div>

        <div class="split player-menu-split">
          <div class="left player-menu-col">
            <p class="muted player-menu-label" data-text="ui-usb-player-menu-available"></p>
            <div id="usbPlayerMenuAvailable" class="player-menu-listbox" role="listbox" data-text-aria-label="ui-usb-player-menu-available-aria-label"></div>
          </div>
          <div class="right player-menu-col">
            <p class="muted player-menu-label" data-text="ui-usb-player-menu-current"></p>
            <div id="usbPlayerMenuCurrent" class="player-menu-listbox" role="listbox" data-text-aria-label="ui-usb-player-menu-current-aria-label"></div>
            <div class="row player-menu-actions">
              <button id="usbPlayerMenuAddBtn" data-text="ui-usb-player-menu-add"></button>
              <button id="usbPlayerMenuRemoveBtn" data-text="ui-usb-player-menu-remove"></button>
